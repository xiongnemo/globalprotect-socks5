# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
#
# Template, not a config: .github/workflows/ci.yml replaces the @NAME@
# placeholders before nFPM reads it. The binary is static (CGO_ENABLED=0), so the
# same file serves the glibc packages and the musl one.
name: gp-socks
arch: "@NFPM_ARCH@"
platform: linux
version: "@NFPM_VERSION@"
version_schema: semver
release: "1"
section: net
maintainer: xiongnemo <xiongnemo@users.noreply.github.com>
description: GlobalProtect VPN as a local SOCKS5 proxy, with SSO.
vendor: xiongnemo
homepage: https://github.com/xiongnemo/globalprotect-socks5
disable_globbing: true
contents:
  - src: "@NFPM_BINARY@"
    dst: /usr/bin/gp-socks
    file_info:
      mode: 0755
  - src: "@NFPM_DOCS@/config.yaml.template"
    # Not under /usr/share/doc: minimal images (Ubuntu's docker image among them)
    # exclude that tree from installs, and this file is needed, not reading.
    dst: /usr/share/gp-socks/config.yaml.template
  - src: "@NFPM_DOCS@/README.md"
    dst: /usr/share/doc/gp-socks/README.md
